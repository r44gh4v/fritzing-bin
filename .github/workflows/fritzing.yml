name: fritzing

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which build do you want?"
        type: choice
        default: "Windows (64-bit)"
        options:
          - "Windows (64-bit)"
          - "macOS (Apple Silicon)"
          - "macOS (Intel)"
          - "Linux (x64)"
          - "All macOS"
          - "Everything"
      version:
        description: "Fritzing version. Leave empty for the latest stable version."
        required: false
  # every push to a work branch that changes the build tests all platforms
  push:
    branches-ignore: [main]
    paths: [build.sh, build.ps1, fix_parts_xml.py, SOURCE.txt, .github/workflows/fritzing.yml]

concurrency:
  group: fritzing-${{ github.ref }}-${{ inputs.platform || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"  # phoenix.pro accepts 6.5.3 .. 6.10.x
  HOMEBREW_NO_AUTO_UPDATE: "1"

# Actions are pinned to commit IDs; the comment shows the version.
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          CHOICE: ${{ inputs.platform || 'Everything' }}
        run: |
          all='[
            {"id":"windows-x64", "label":"Windows (64-bit)",      "group":"windows", "runner":"windows-2025",   "qt_host":"windows", "qt_arch":"win64_msvc2022_64"},
            {"id":"macos-arm64", "label":"macOS (Apple Silicon)", "group":"macos",   "runner":"macos-15",       "qt_host":"mac",     "qt_arch":"clang_64"},
            {"id":"macos-x64",   "label":"macOS (Intel)",         "group":"macos",   "runner":"macos-15-intel", "qt_host":"mac",     "qt_arch":"clang_64"},
            {"id":"linux-x64",   "label":"Linux (x64)",           "group":"linux",   "runner":"ubuntu-22.04",   "qt_host":"linux",   "qt_arch":"linux_gcc_64"}
          ]'
          case "$CHOICE" in
            "Everything") filter='.' ;;
            "All macOS")  filter='map(select(.group=="macos"))' ;;
            *)            filter='map(select(.label==env.CHOICE))' ;;
          esac
          echo "matrix=$(jq -c "$filter" <<<"$all")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtserialport qt5compat
          cache: true

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            boost_1_85_0/boost
            svgpp-1.3.1
            zlib
            libgit2-1.7.1
            Clipper1-6.4.2
            quazip-*
            ngspice-42
          key: deps-${{ matrix.id }}-qt${{ env.QT_VERSION }}-${{ hashFiles('build.sh', 'build.ps1') }}

      - name: Compiler cache (macOS, Linux)
        if: matrix.group != 'windows'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: ${{ matrix.id }}
          max-size: 1G
          evict-old-files: job
          job-summary: ''

      - name: Install build tools (Linux)
        if: matrix.group == 'linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -yq build-essential cmake pkg-config unzip libssl-dev libudev-dev \
            libgl1-mesa-dev libfontconfig1-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install build tools (macOS)
        if: matrix.group == 'macos'
        run: |
          brew install openssl@3 pkgconf || brew install openssl@3 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      # not Git Bash: its /usr/bin/link would shadow the MSVC linker
      - name: Build Fritzing (Windows)
        if: matrix.group == 'windows'
        shell: pwsh
        env:
          REF: ${{ inputs.version }}
        run: ./build.ps1 -Ref "$env:REF" -Platform "${{ matrix.id }}"

      - name: Build Fritzing (macOS, Linux)
        if: matrix.group != 'windows'
        shell: bash
        env:
          REF: ${{ inputs.version }}
        run: bash build.sh "${{ matrix.group }}" "$REF" "${{ matrix.id }}"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: github/*
          archive: false
          retention-days: 2
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          f="$(ls github)"
          sum="$( (sha256sum "github/$f" 2>/dev/null || shasum -a 256 "github/$f") | cut -d' ' -f1)"
          {
            echo "### ${{ matrix.label }}"
            echo
            echo "**1. Download.** Scroll down to **Artifacts** and click **$f**. GitHub deletes it after 2 days."
            echo
            case "${{ matrix.group }}" in
              windows) cat <<'EOF'
          **2. Unzip.** Right-click the downloaded file and select **Extract All**, then **Extract**. Fritzing does not start from inside the zip file.

          **3. Start.** Open the new folder and double-click **Fritzing** (Fritzing.exe).

          **4. First start only.** Windows shows "Windows protected your PC", because this build is not signed. Click **More info**, then **Run anyway**.
          EOF
              ;;
              macos) cat <<'EOF'
          **2. Unzip.** Double-click the downloaded file. You get **Fritzing**. Drag it into your **Applications** folder.

          **3. Start.** Double-click **Fritzing**. macOS shows a warning, because Apple did not check this build. Click **Done** (or **Cancel**).

          **4. Allow it, first start only.** Open **System Settings**, then **Privacy & Security**. Scroll down and click **Open Anyway** next to "Fritzing". Enter your password. Click **Open Anyway** again.

          If macOS says the app "is damaged", open **Terminal**, paste `xattr -cr /Applications/Fritzing.app`, press Return, and start Fritzing again.
          EOF
              ;;
              linux) cat <<'EOF'
          **2. Allow it to run.** Right-click the downloaded file and select **Properties**. Turn on **Executable as Program** (on some systems: **Permissions** tab, **Allow executing file as program**).

          **3. Start.** Double-click the file.

          EOF
                printf 'If nothing happens: right-click in the folder, select **Open in Terminal**, type `./%s --appimage-extract-and-run` and press Enter.\n' "$f"
              ;;
            esac
            echo
            echo "<sub>SHA-256: \`$sum\`</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
