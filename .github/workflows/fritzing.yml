name: fritzing

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which build do you want?"
        type: choice
        default: "Windows (64-bit)"
        options:
          - "Windows (64-bit)"
          - "macOS (Apple Silicon)"
          - "macOS (Intel)"
          - "Linux (x64)"
          - "All macOS"
          - "Everything"
      version:
        description: "Fritzing version. Leave empty for the latest stable version. Or type a version (1.0.7), \"develop\", or a fritzing-app branch or tag."
        required: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"  # phoenix.pro accepts 6.5.3 .. 6.10.x
  HOMEBREW_NO_AUTO_UPDATE: "1"

# Actions are pinned to commit IDs so a moved tag cannot change the build; the comment shows the version.
jobs:
  # Turns the friendly choice above into a list of build targets.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          CHOICE: ${{ inputs.platform }}
        run: |
          all='[
            {"id":"windows-x64", "label":"Windows (64-bit)",      "group":"windows", "runner":"windows-2025",   "qt_host":"windows", "qt_arch":"win64_msvc2022_64"},
            {"id":"macos-arm64", "label":"macOS (Apple Silicon)", "group":"macos",   "runner":"macos-15",       "qt_host":"mac",     "qt_arch":"clang_64"},
            {"id":"macos-x64",   "label":"macOS (Intel)",         "group":"macos",   "runner":"macos-15-intel", "qt_host":"mac",     "qt_arch":"clang_64"},
            {"id":"linux-x64",   "label":"Linux (x64)",           "group":"linux",   "runner":"ubuntu-22.04",   "qt_host":"linux",   "qt_arch":"linux_gcc_64"}
          ]'
          case "$CHOICE" in
            "Everything") filter='.' ;;
            "All macOS")  filter='map(select(.group=="macos"))' ;;
            *)            filter='map(select(.label==env.CHOICE))' ;;
          esac
          echo "matrix=$(jq -c "$filter" <<<"$all")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtserialport qt5compat
          cache: true

      # Built dependencies are reused until build.sh or build.ps1 changes
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            boost_1_85_0/boost
            svgpp-1.3.1
            zlib
            libgit2-1.7.1
            Clipper1-6.4.2
            quazip-*
            ngspice-42
          key: deps-${{ matrix.id }}-qt${{ env.QT_VERSION }}-${{ hashFiles('build.sh', 'build.ps1') }}

      - name: Install build tools (Linux)
        if: matrix.group == 'linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -yq build-essential cmake pkg-config unzip libssl-dev libudev-dev \
            libgl1-mesa-dev libfontconfig1-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install build tools (macOS)
        if: matrix.group == 'macos'
        run: |
          brew install openssl@3 pkgconf || brew install openssl@3 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Windows must not run from Git Bash: its /usr/bin/link would shadow the MSVC linker
      - name: Build Fritzing (Windows)
        if: matrix.group == 'windows'
        shell: pwsh
        env:
          REF: ${{ inputs.version }}
        run: ./build.ps1 -Ref "$env:REF" -Platform "${{ matrix.id }}"

      - name: Build Fritzing (macOS, Linux)
        if: matrix.group != 'windows'
        shell: bash
        env:
          REF: ${{ inputs.version }}
        run: bash build.sh "${{ matrix.group }}" "$REF" "${{ matrix.id }}"

      # archive: false = the download is the build file itself, not a zip around it
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: github/*
          archive: false
          retention-days: 2
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo "Download **$(ls github)** from the *Artifacts* section below. It is deleted after 2 days."
            case "${{ matrix.group }}" in
              windows) echo "Unzip it, then run \`Fritzing.exe\`." ;;
              linux)   echo "Extract it (\`tar xzf\`), then run \`./Fritzing\`." ;;
              macos)   echo "Unzip it to get Fritzing.app. First launch: right-click > Open (Apple did not check this build)." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
